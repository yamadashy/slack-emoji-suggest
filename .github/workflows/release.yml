name: Release

# Publishes a built zip on a GitHub Release whenever package.json's version is
# one that has no release yet. Bumping "version" in package.json and pushing to
# main is the whole release process.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read version
        id: version
        run: echo "tag=v$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.existing.outputs.found == 'false'
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        if: steps.existing.outputs.found == 'false'
        run: npm ci

      # `wxt zip` puts manifest.json at the root of the archive: dropping a zip
      # onto chrome://extensions fails with "Could not unzip extension" when it
      # is inside a folder. It names the file after the version, so it is copied
      # to a fixed name -- releases/latest/download/slack-emoji-suggest.zip has
      # to keep working, and the README links to it.
      - name: Build zip
        if: steps.existing.outputs.found == 'false'
        run: |
          npm run zip
          cp ".output/slack-emoji-suggest-$(jq -r .version package.json)-chrome.zip" slack-emoji-suggest.zip

      - name: Create release
        if: steps.existing.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" slack-emoji-suggest.zip \
            --target "$GITHUB_SHA" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
